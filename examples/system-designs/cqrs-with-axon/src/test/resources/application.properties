# Test profile DB: separate in-memory H2 instance, recreated per run.
spring.datasource.url=jdbc:h2:mem:cqrs-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
logging.level.com.javamastery.examples.cqrs.read.ProductProjection=DEBUG
