# ---------------------------------------------------------------------------
# H2 in-memory database. Zero external infra: the DB lives in the JVM and is
# gone when the process exits. Both the write table (product_write) and the
# read table (product_view) are created here by Hibernate's ddl-auto.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:cqrs;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create both schemas on startup (fine for a demo; use migrations in real systems).
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Browse the data at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:cqrs).
# Run `SELECT * FROM PRODUCT_WRITE;` and `SELECT * FROM PRODUCT_VIEW;` to see the two
# independent models side by side.
spring.h2.console.enabled=true

# Quieter logs; bump the projection package to DEBUG to watch events being applied.
logging.level.org.hibernate.SQL=off
logging.level.com.javamastery.examples.cqrs.read.ProductProjection=DEBUG
