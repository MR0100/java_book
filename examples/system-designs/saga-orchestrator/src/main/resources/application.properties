# =============================================================================
# Saga Orchestrator - application configuration
#
# Everything here is tuned so the app boots with NO external infrastructure.
# =============================================================================

spring.application.name=saga-orchestrator

# --- H2 in-memory datasource -------------------------------------------------
# DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the life of the JVM
# (otherwise H2 drops the schema when the last connection closes).
spring.datasource.url=jdbc:h2:mem:sagaorchestrator;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---------------------------------------------------------
# create-drop: build the schema from the @Entity classes on startup, drop on shutdown.
# Fine for a demo; a real deployment would use Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Set to true if you want to eyeball the generated SQL.
spring.jpa.show-sql=false

# --- H2 web console at http://localhost:8080/h2-console (JDBC URL above) ------
spring.h2.console.enabled=true
