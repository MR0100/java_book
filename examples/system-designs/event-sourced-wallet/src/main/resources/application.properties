# ---------------------------------------------------------------------------
# Event-sourced wallet — runs entirely on an in-memory H2 database.
# No external infrastructure (no Postgres/MySQL, no broker, no cache).
# ---------------------------------------------------------------------------

spring.application.name=event-sourced-wallet

# In-memory H2. DB_CLOSE_DELAY=-1 keeps the schema alive for the JVM's lifetime
# even between connections. The event_store table lives here and only ever grows.
spring.datasource.url=jdbc:h2:mem:walletdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the single event_store table from the JPA entity on startup.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true

# Browse the append-only log directly at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:walletdb). Handy for SEEING that there is no balance column.
spring.h2.console.enabled=true

# Quieter logs; flip to DEBUG to watch each INSERT into the event store.
logging.level.org.hibernate.SQL=INFO
