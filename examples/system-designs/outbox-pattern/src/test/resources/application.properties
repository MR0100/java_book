# Test config: same as main, but the relay poll delay is pushed far out so the
# scheduler does NOT auto-fire during a test. Tests call OutboxRelay.pollAndPublish()
# directly to control exactly when publication happens and to assert before/after.
outbox.relay.poll-delay-ms=3600000

spring.datasource.url=jdbc:h2:mem:outbox-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
