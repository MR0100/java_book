# =============================================================================
# Transactional Outbox - application configuration
#
# Tuned so the app boots with NO external infrastructure: H2 stands in for the
# RDBMS and an in-memory EventPublisher stands in for the broker (Kafka).
# =============================================================================

spring.application.name=outbox-pattern

# --- OutboxRelay poll cadence ------------------------------------------------
# The relay polls the outbox every poll-delay-ms (fixedDelay, measured from the
# end of the previous run). 1s is snappy for a demo; in production you trade
# latency vs load here (or replace polling with CDC/Debezium entirely).
# Tests OVERRIDE this to a large value so the relay does not auto-fire mid-test
# and they can invoke pollAndPublish() deterministically.
outbox.relay.poll-delay-ms=1000

# --- H2 in-memory datasource -------------------------------------------------
# DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the life of the JVM
# (otherwise H2 drops the schema when the last connection closes).
spring.datasource.url=jdbc:h2:mem:outbox;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---------------------------------------------------------
# create-drop: build the schema from the @Entity classes on startup, drop on
# shutdown. Fine for a demo; a real deployment would use Flyway/Liquibase, and
# the outbox table would typically be created by the same migration as the
# business tables so the dual-write invariant is enforced from day one.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Set to true to eyeball the generated SQL (incl. the outbox INSERT/UPDATE).
spring.jpa.show-sql=false

# --- H2 web console at http://localhost:8080/h2-console (JDBC URL above) ------
# Handy for watching outbox_event rows flip published=false -> true as the relay runs.
spring.h2.console.enabled=true
