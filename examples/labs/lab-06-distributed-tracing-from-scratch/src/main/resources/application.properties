# ---------------------------------------------------------------------------
# Distributed-tracing-from-scratch lab — runtime configuration
# ---------------------------------------------------------------------------

# Fixed port for `mvn spring-boot:run`. The edge endpoint discovers the live port
# at call time (see SelfBaseUrlProvider), so the @SpringBootTest works on a random
# port with no extra configuration — the internal hop is always self-contained.
server.port=8080

# Head-based sampling rate for NEW traces (0.0-1.0). 1.0 = sample everything,
# which is what you want for a lab so every request prints a full trace tree.
# Try 0.0 to watch the filter still run but skip recording/exporting.
app.tracing.sample-rate=1.0
