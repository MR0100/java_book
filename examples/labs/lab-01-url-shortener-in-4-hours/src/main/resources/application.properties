# ---------------------------------------------------------------------------
# URL shortener lab — runtime configuration
# ---------------------------------------------------------------------------
# H2 in-memory database. The URL "jdbc:h2:mem:shortener" means: a database
# named "shortener" that lives only in the JVM heap and vanishes on shutdown.
# DB_CLOSE_DELAY=-1 keeps it alive as long as the JVM is up (otherwise H2
# drops the DB when the last connection closes).
spring.datasource.url=jdbc:h2:mem:shortener;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from our @Entity on startup. Fine for a lab /
# in-memory DB; in production you would use Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Browse the data at http://localhost:8080/h2-console (JDBC URL above, user sa).
spring.h2.console.enabled=true

# Base URL used when building the short link returned to the caller.
# Override with an env var APP_BASE_URL or -Dapp.base-url=... at deploy time.
app.base-url=http://localhost:8080
